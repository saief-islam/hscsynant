  SETS.forEach(function(s){
    var b=best[s.n],done=b!==undefined;
    h+='<button class="chip'+(done?' done':'')+'" data-set="'+s.n+'" aria-pressed="'+(cur===s.n)+'"><span class="no">SET '+s.n+'</span><span class="nm">'+esc(s.b)+' '+s.y+'</span><span class="best">'+(done?'Best '+b+'/'+s.items.length:s.items.length+' words')+'</span></button>';
  });
  return h+'</div>';
}

function startSet(id){
  cur=id;
  if(id==="mix"){
    var all=[];SETS.forEach(function(s){s.items.forEach(function(i){all.push({it:i,lab:"Set "+s.n})})});
    list=shuffle(all).slice(0,15);
  }else{
    var s=SETS.filter(function(x){return x.n===id})[0];
    list=s.items.map(function(i){return {it:i,lab:""}});
  }
  list.forEach(function(q){q.state=null});
  render();
}

function render(){
  if(mode==="k"){renderKey();return}
  var h=picker();
  if(cur===null){
    h+='<div class="empty">Pick a set above. Then type the synonym or antonym of each word and press Enter.</div>';
    app.innerHTML=h;return;
  }
  var title=cur==="mix"?"Mix · 15 words":"Set "+cur+" · "+SETS.filter(function(x){return x.n===cur})[0].b+" "+SETS.filter(function(x){return x.n===cur})[0].y;
  h+='<div class="bar"><h2>'+esc(title)+'</h2><span class="score" id="score" aria-live="polite"></span><button class="btn" id="checkall">Check all</button><button class="btn" id="reset">Restart</button></div>';
  h+='<div id="qs">';
  list.forEach(function(q,i){
    var it=q.it,t=it[3]==="s"?"Synonym":"Antonym";
    h+='<div class="q" id="q'+i+'"><div class="n">'+(i+1)+'</div><div class="main"><span class="tag '+it[3]+'">'+t+'</span><span class="word">'+esc(it[0])+'</span>'
     +'<div class="meta">('+esc(it[1])+') <span class="bn">'+esc(it[2])+'</span>'+(q.lab?' · '+q.lab:'')+'</div>'
     +'<div class="ans"><input id="a'+i+'" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type a '+t.toLowerCase()+'" aria-label="'+t+' of '+esc(it[0])+'"><button class="btn" data-check="'+i+'">Check</button><button class="btn" data-show="'+i+'">Show</button></div></div>'
     +'<div class="fb" id="f'+i+'"></div></div>';
  });
  h+='</div><div id="result"></div>';
  app.innerHTML=h;
  updateScore();
}

function grade(i,reveal){
  var q=list[i],it=q.it,box=document.getElementById("q"+i),fb=document.getElementById("f"+i),inp=document.getElementById("a"+i);
  var acc=pieces(it[4]),typed=pieces(inp.value);
  var note=it[5]?'<span class="note">'+esc(it[5])+'</span>':'';
  box.classList.remove("ok","bad");
  if(reveal){
    q.state=q.state==="ok"?"ok":"bad";
    if(q.state==="bad")box.classList.add("bad");else box.classList.add("ok");
    fb.innerHTML='Answer: <b>'+esc(it[4])+'</b>'+note;
  }else if(!typed.length){
    fb.innerHTML="";q.state=null;return;
  }else{
    var hit=typed.some(function(t){return acc.indexOf(t)>-1});
    q.state=hit?"ok":"bad";
    box.classList.add(hit?"ok":"bad");
    fb.innerHTML=hit?'Correct ✓ &nbsp;<span style="font-weight:400">In the book: '+esc(it[4])+'</span>'+note:'Not a match. Answer: <b>'+esc(it[4])+'</b>'+note;
  }
  updateScore();
}

function updateScore(){
  var ok=0,done=0;list.forEach(function(q){if(q.state){done++;if(q.state==="ok")ok++}});
  var el=document.getElementById("score");if(!el)return;
  el.textContent=ok+" / "+list.length+" correct";
  var r=document.getElementById("result");
  if(done===list.length&&list.length){
    if(cur!=="mix")saveBest(cur,ok);
    var wrong=list.length-ok;
    r.innerHTML='<div class="result"><strong>'+ok+' / '+list.length+'</strong><span>'+(wrong?wrong+' wrong. Try again.':'All correct! Move on to the next set.')+'</span>'+(wrong?'<button class="btn primary" id="retry">Retry wrong only</button>':'')+'</div>';
    refreshPicker();
  }else r.innerHTML="";
}
function refreshPicker(){
  var p=document.querySelector(".picker");if(!p)return;
  var d=document.createElement("div");d.innerHTML=picker();p.replaceWith(d.firstChild);
}

function renderKey(){
  var h="";
  SETS.forEach(function(s){
    h+='<section class="key"><h3>Set '+s.n+' · '+esc(s.b)+' '+s.y+'</h3>';
    s.items.forEach(function(it,i){
      h+='<div class="row"><span class="l">'+(i+1)+'</span><span class="w"><b>'+esc(it[0])+'</b> <span style="color:var(--muted)">('+esc(it[1])+')</span><small>'+esc(it[2])+'</small></span><span class="t"><span class="tag '+it[3]+'">'+(it[3]==="s"?"Synonym":"Antonym")+'</span></span><span class="r">'+esc(it[4])+(it[5]?'<small style="display:block;color:var(--muted);font-family:var(--bn)">'+esc(it[5])+'</small>':'')+'</span></div>';
    });
    h+='</section>';
  });
  app.innerHTML=h;
}

document.getElementById("tab-p").onclick=function(){mode="p";this.setAttribute("aria-pressed","true");document.getElementById("tab-k").setAttribute("aria-pressed","false");render()};
document.getElementById("tab-k").onclick=function(){mode="k";this.setAttribute("aria-pressed","true");document.getElementById("tab-p").setAttribute("aria-pressed","false");render()};

app.addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;
  if(t.dataset.set){startSet(t.dataset.set==="mix"?"mix":parseInt(t.dataset.set,10));window.scrollTo(0,0);return}
  if(t.dataset.check!==undefined){grade(+t.dataset.check,false);return}
  if(t.dataset.show!==undefined){grade(+t.dataset.show,true);return}
  if(t.id==="checkall"){list.forEach(function(q,i){if(!q.state)grade(i,false)});return}
  if(t.id==="reset"){startSet(cur);return}
  if(t.id==="retry"){
    list=list.filter(function(q){return q.state!=="ok"});
    list.forEach(function(q){q.state=null});
    var keep=cur;render();cur=keep;window.scrollTo(0,0);return;
  }
});
app.addEventListener("keydown",function(e){
  if(e.key!=="Enter"||!e.target.matches(".ans input"))return;
  var i=+e.target.id.slice(1);grade(i,false);
  var nx=document.getElementById("a"+(i+1));if(nx)nx.focus();
});

render();
</script>

</body></html>
